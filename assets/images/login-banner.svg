<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow1" cx="30%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cardGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="800" fill="#0B1120"/>
  <rect width="1200" height="800" fill="url(#bgGlow1)"/>
  <rect width="1200" height="800" fill="url(#bgGlow2)"/>

  <!-- Subtle Perspective Network Grid -->
  <g opacity="0.12" stroke="#6366F1" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>

    <line x1="150" y1="0" x2="150" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="450" y1="0" x2="450" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="750" y1="0" x2="750" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
    <line x1="1050" y1="0" x2="1050" y2="800"/>
  </g>

  <!-- Network Connecting Beams & Waveforms -->
  <g opacity="0.65">
    <path d="M 240 400 C 380 400, 420 380, 580 380" stroke="#6366F1" stroke-width="3" stroke-dasharray="6 6"/>
    <path d="M 620 380 C 760 380, 800 400, 960 400" stroke="#06B6D4" stroke-width="3" stroke-dasharray="6 6"/>
    <!-- Voice Signal Waveform -->
    <path d="M 440 380 Q 460 330, 480 380 T 520 380 T 560 380" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.8"/>
    <path d="M 640 380 Q 660 340, 680 380 T 720 380 T 760 380" stroke="#10B981" stroke-width="2.5" fill="none" opacity="0.8"/>
  </g>

  <!-- LEFT NODE: Campus & Hostel Terminal -->
  <g transform="translate(140, 260)" filter="url(#shadow)">
    <rect width="220" height="280" rx="20" fill="url(#cardGrad)" stroke="url(#glassBorder)" stroke-width="1.5"/>
    <!-- Campus Icon Header -->
    <rect x="24" y="24" width="48" height="48" rx="12" fill="#4F46E5" fill-opacity="0.25"/>
    <path d="M 36 54 L 48 40 L 60 54 Z" fill="#818CF8"/>
    <rect x="42" y="48" width="12" height="12" fill="#818CF8"/>
    <line x1="34" y1="56" x2="62" y2="56" stroke="#818CF8" stroke-width="2"/>
    
    <text x="24" y="104" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="16">Campus &amp; Hostel</text>
    <text x="24" y="124" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Source Terminal</text>

    <!-- Student Badge -->
    <g transform="translate(20, 145)">
      <rect width="180" height="48" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="28" cy="24" r="14" fill="#6366F1"/>
      <text x="28" y="28" fill="#FFF" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">ST</text>
      <text x="52" y="20" fill="#F8FAFC" font-family="system-ui" font-size="12" font-weight="600">Aarav Sharma</text>
      <text x="52" y="34" fill="#64748B" font-family="system-ui" font-size="10">Class 10-A · PIN #8841</text>
    </g>

    <!-- Allowed Schedule Box -->
    <g transform="translate(20, 205)">
      <rect width="180" height="48" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="24" cy="24" r="6" fill="#10B981"/>
      <text x="38" y="20" fill="#10B981" font-family="system-ui" font-size="11" font-weight="600">Window Open</text>
      <text x="38" y="34" fill="#94A3B8" font-family="system-ui" font-size="10">17:00 – 19:30 IST</text>
    </g>
  </g>

  <!-- CENTER NODE: Android Enterprise Restricted Calling Device -->
  <g transform="translate(480, 150)" filter="url(#shadow)">
    <!-- Outer Device Rim -->
    <rect width="240" height="480" rx="36" fill="#0B132B" stroke="url(#phoneBorder)" stroke-width="2.5"/>
    <rect x="10" y="10" width="220" height="460" rx="28" fill="#0F172A"/>

    <!-- Screen Notch/Speaker -->
    <rect x="90" y="22" width="60" height="6" rx="3" fill="#334155"/>
    <circle cx="160" cy="25" r="3" fill="#1E293B"/>

    <!-- Device App Header -->
    <g transform="translate(24, 46)">
      <rect width="192" height="34" rx="8" fill="#1E293B"/>
      <circle cx="18" cy="17" r="7" fill="#10B981"/>
      <text x="34" y="21" fill="#F8FAFC" font-family="system-ui" font-size="11" font-weight="600">S2D KIOSK ACTIVE</text>
    </g>

    <!-- Big Shield Icon in Center of Device -->
    <g transform="translate(70, 100)">
      <circle cx="50" cy="50" r="46" fill="url(#shieldGrad)" filter="url(#glow)" opacity="0.4"/>
      <path d="M 50 20 L 78 34 V 60 C 78 78 50 92 50 92 C 50 92 22 78 22 60 V 34 Z" fill="url(#shieldGrad)"/>
      <path d="M 40 54 L 47 61 L 62 45" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Caller Information on Device -->
    <g transform="translate(20, 215)">
      <text x="100" y="20" fill="#94A3B8" font-family="system-ui" font-size="11" text-anchor="middle">ACTIVE CALL IN PROGRESS</text>
      <text x="100" y="46" fill="#FFFFFF" font-family="system-ui" font-size="18" font-weight="700" text-anchor="middle">Father (Primary)</text>
      <text x="100" y="66" fill="#38BDF8" font-family="system-ui" font-size="13" font-weight="600" text-anchor="middle">+91 98451 •••••</text>
      
      <!-- Call Timer -->
      <rect x="40" y="82" width="120" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="56" cy="99" r="4" fill="#EF4444"/>
      <text x="70" y="104" fill="#F8FAFC" font-family="system-ui" font-size="14" font-weight="700">08:42</text>
      <text x="116" y="104" fill="#64748B" font-family="system-ui" font-size="11">/ 15m</text>

      <!-- Whitelist Verified Tag -->
      <rect x="20" y="132" width="160" height="28" rx="6" fill="#065F46" fill-opacity="0.3" stroke="#10B981" stroke-width="1"/>
      <text x="100" y="151" fill="#34D399" font-family="system-ui" font-size="10" font-weight="600" text-anchor="middle">✓ POLICE &amp; GUARDIAN VERIFIED</text>
    </g>

    <!-- Device End Call Bar -->
    <g transform="translate(30, 400)">
      <rect width="180" height="42" rx="21" fill="#DC2626"/>
      <path d="M 80 22 C 85 16, 95 16, 100 22" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
      <text x="108" y="26" fill="#FFF" font-family="system-ui" font-size="12" font-weight="bold">End Call</text>
    </g>
  </g>

  <!-- RIGHT NODE: Verified Destination (Parent/Guardian) -->
  <g transform="translate(840, 260)" filter="url(#shadow)">
    <rect width="220" height="280" rx="20" fill="url(#cardGrad)" stroke="url(#glassBorder)" stroke-width="1.5"/>
    <!-- Parent/Guardian Header -->
    <rect x="24" y="24" width="48" height="48" rx="12" fill="#06B6D4" fill-opacity="0.25"/>
    <circle cx="48" cy="42" r="8" fill="#38BDF8"/>
    <path d="M 36 60 C 36 52 42 48 48 48 C 54 48 60 52 60 60" fill="#38BDF8"/>
    
    <text x="24" y="104" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="16">Verified Guardian</text>
    <text x="24" y="124" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Destination Endpoint</text>

    <!-- Whitelisted Contact Box -->
    <g transform="translate(20, 145)">
      <rect width="180" height="48" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="28" cy="24" r="14" fill="#0891B2"/>
      <text x="28" y="28" fill="#FFF" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">GD</text>
      <text x="52" y="20" fill="#F8FAFC" font-family="system-ui" font-size="12" font-weight="600">Rajesh Sharma</text>
      <text x="52" y="34" fill="#64748B" font-family="system-ui" font-size="10">Whitelisted Guardian 1</text>
    </g>

    <!-- Balance & Rate Box -->
    <g transform="translate(20, 205)">
      <rect width="180" height="48" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="18" y="22" fill="#94A3B8" font-family="system-ui" font-size="11">Wallet Balance</text>
      <text x="18" y="38" fill="#38BDF8" font-family="system-ui" font-size="14" font-weight="bold">$48.50 USD</text>
      <text x="120" y="38" fill="#10B981" font-family="system-ui" font-size="11" font-weight="600">324 Mins</text>
    </g>
  </g>

  <!-- FLOATING BADGES AROUND CANVAS -->
  <!-- Top Left Badge: MDM Certified -->
  <g transform="translate(180, 150)" filter="url(#shadow)">
    <rect width="190" height="52" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <circle cx="28" cy="26" r="12" fill="#4F46E5"/>
    <path d="M 23 26 L 27 30 L 34 22" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
    <text x="48" y="22" fill="#F8FAFC" font-family="system-ui" font-size="11" font-weight="bold">Android Enterprise</text>
    <text x="48" y="37" fill="#94A3B8" font-family="system-ui" font-size="10">Dedicated Kiosk Lock</text>
  </g>

  <!-- Top Right Badge: 100% Whitelist -->
  <g transform="translate(820, 150)" filter="url(#shadow)">
    <rect width="200" height="52" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <circle cx="28" cy="26" r="12" fill="#10B981"/>
    <path d="M 23 26 L 27 30 L 34 22" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
    <text x="48" y="22" fill="#F8FAFC" font-family="system-ui" font-size="11" font-weight="bold">Zero Unknown Numbers</text>
    <text x="48" y="37" fill="#34D399" font-family="system-ui" font-size="10">Strict Whitelist Policy</text>
  </g>

  <!-- Bottom Floating Stats Bar -->
  <g transform="translate(240, 680)" filter="url(#shadow)">
    <rect width="720" height="64" rx="16" fill="#0F172A" stroke="url(#glassBorder)" stroke-width="1.5"/>
    
    <!-- Stat 1 -->
    <g transform="translate(40, 18)">
      <text x="0" y="16" fill="#FFFFFF" font-family="system-ui" font-size="16" font-weight="bold">85+ Campuses</text>
      <text x="0" y="32" fill="#64748B" font-family="system-ui" font-size="10">Active Institutions</text>
    </g>
    <line x1="190" y1="14" x2="190" y2="50" stroke="#334155" stroke-width="1"/>

    <!-- Stat 2 -->
    <g transform="translate(225, 18)">
      <text x="0" y="16" fill="#38BDF8" font-family="system-ui" font-size="16" font-weight="bold">12,400+ Students</text>
      <text x="0" y="32" fill="#64748B" font-family="system-ui" font-size="10">Enrolled &amp; Whitelisted</text>
    </g>
    <line x1="410" y1="14" x2="410" y2="50" stroke="#334155" stroke-width="1"/>

    <!-- Stat 3 -->
    <g transform="translate(445, 18)">
      <text x="0" y="16" fill="#34D399" font-family="system-ui" font-size="16" font-weight="bold">100% Policy Bound</text>
      <text x="0" y="32" fill="#64748B" font-family="system-ui" font-size="10">Schedule &amp; Cap Enforced</text>
    </g>
    <line x1="600" y1="14" x2="600" y2="50" stroke="#334155" stroke-width="1"/>

    <!-- Stat 4 -->
    <g transform="translate(625, 18)">
      <text x="0" y="16" fill="#FBBF24" font-family="system-ui" font-size="16" font-weight="bold">3 Portals</text>
      <text x="0" y="32" fill="#64748B" font-family="system-ui" font-size="10">Super, Franchise, School</text>
    </g>
  </g>
</svg>

