<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Classes — School Admin — Source 2 Destination</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/icons/favicon.svg">
  <link rel="stylesheet" href="../../assets/vendor/bootstrap.min.css">
  <script src="../../assets/vendor/tailwind-config.js"></script>
  <script src="../../assets/vendor/tailwindcss-cdn.js"></script>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/tables.css">
  <link rel="stylesheet" href="../../assets/css/forms.css">
  <link rel="stylesheet" href="../../assets/css/charts.css">
  <link rel="stylesheet" href="../../assets/css/animations.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body data-role="school-admin" data-root="../../" data-route="school-admin/classes/list.html" data-section="Classes & Sections" data-page-title="Classes Management">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-content">

        <div class="page-header">
          <div class="page-header-info"><div class="page-eyebrow">ACADEMIC HIERARCHY</div><h1 class="page-title">Campus Classes Management</h1><p class="page-description">Manage academic grades, faculty coordinators, default daily duration limits, and student counts.</p></div>
          <div class="page-actions">
            <a href="sections.html" class="btn-s2d btn-s2d-secondary"><i data-lucide="layout-list"></i><span>Manage Sections</span></a>
            <button type="button" class="btn-s2d btn-s2d-primary" data-modal-open="add-class-modal"><i data-lucide="plus"></i><span>Add Class</span></button>
          </div>
        </div>
        <div data-s2d-table="sch-classes-table"></div>
        <div class="s2d-modal-backdrop" id="add-class-modal">
          <div class="s2d-modal-dialog"><div class="s2d-modal-header"><h3 class="s2d-card-title">Create New Academic Class</h3><button type="button" class="btn-s2d btn-s2d-ghost btn-icon-s2d" data-modal-close><i data-lucide="x"></i></button></div>
            <form data-s2d-form data-success-title="Class Added (Demo)"><div class="s2d-modal-body">
              <div class="s2d-field"><label class="s2d-label">Class / Grade Name <span class="req-star">*</span></label><input type="text" class="s2d-input" placeholder="Grade 6" required></div>
              <div class="s2d-field"><label class="s2d-label">Grade Coordinator <span class="req-star">*</span></label><input type="text" class="s2d-input" placeholder="Mrs. Eleanor Hughes" required></div>
              <div class="s2d-field"><label class="s2d-label">Default Daily Call Cap (Mins) <span class="req-star">*</span></label><input type="number" min="5" max="20" class="s2d-input" value="10" required></div>
            </div><div class="s2d-modal-footer"><button type="button" class="btn-s2d btn-s2d-secondary" data-modal-close>Cancel</button><button type="submit" class="btn-s2d btn-s2d-primary">Save Class</button></div></form>
          </div>
        </div>
    
      </main>
    </div>
  </div>

  <script src="../../assets/vendor/lucide.min.js"></script>
  <script src="../../assets/vendor/gsap.min.js"></script>
  <script src="../../assets/js/api-config.js"></script>
  <script src="../../assets/js/demo-data.js"></script>
  <script src="../../assets/js/notifications.js"></script>
  <script src="../../assets/js/modals.js"></script>
  <script src="../../assets/js/navigation.js"></script>
  <script src="../../assets/js/sidebar.js"></script>
  <script src="../../assets/js/tables.js"></script>
  <script src="../../assets/js/forms.js"></script>
  <script src="../../assets/js/charts.js"></script>
  <script src="../../assets/js/animations.js"></script>
  <script src="../../assets/js/app.js"></script>
</body>
</html>
