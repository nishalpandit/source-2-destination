<body data-role="school-admin" data-root="../../" data-route="school-admin/hostel-wardens/edit.html" data-section="Hostel Wardens" data-page-title="Edit Warden">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-content">

        <div class="page-header">
          <div class="page-header-info"><div class="page-eyebrow">UPDATE WARDEN · <span data-bind-field="id">WRD-601</span></div><h1 class="page-title">Edit <span data-bind-field="name">Major Kenneth Cole (Ret.)</span></h1><p class="page-description">Update dormitory wing assignment, duty shift hours, or emergency override privileges.</p></div>
          <div class="page-actions"><a href="list.html" class="btn-s2d btn-s2d-secondary"><i data-lucide="arrow-left"></i><span>Back</span></a></div>
        </div>
        <div class="s2d-card"><div class="s2d-card-body">
          <form data-s2d-form data-warn-unsaved="true" data-redirect="details.html?id=WRD-601" data-success-title="Warden Assignment Updated (Demo)">
            <div class="row g-3">
              <div class="col-md-6 s2d-field"><label class="s2d-label">Warden Name <span class="req-star">*</span></label><input type="text" name="name" class="s2d-input" data-bind-field="name" value="Major Kenneth Cole (Ret.)" required></div>
              <div class="col-md-6 s2d-field"><label class="s2d-label">Hostel Wing <span class="req-star">*</span></label><input type="text" name="hostelWing" class="s2d-input" data-bind-field="hostelWing" value="North Hall (Boys Grades 10–11)" required></div>
              <div class="col-md-4 s2d-field"><label class="s2d-label">Shift Hours <span class="req-star">*</span></label><input type="text" name="shiftHours" class="s2d-input mono-code" data-bind-field="shiftHours" value="16:00 – 00:00" required></div>
              <div class="col-md-4 s2d-field"><label class="s2d-label">Phone <span class="req-star">*</span></label><input type="tel" name="phone" class="s2d-input" data-bind-field="phone" data-validate-phone="true" value="+1 (555) 210-9101" required></div>
              <div class="col-md-4 s2d-field"><label class="s2d-label">Status</label><select name="status" class="s2d-select" data-bind-field="status"><option value="Active">Active</option><option value="Inactive">On Leave / Inactive</option></select></div>
            </div>
            <div class="form-actions-bar"><div class="ms-auto d-flex gap-2"><a href="list.html" class="btn-s2d btn-s2d-secondary">Cancel</a><button type="submit" class="btn-s2d btn-s2d-primary"><i data-lucide="save"></i><span>Save Warden</span></button></div></div>
          </form>
        </div></div>
    
      </main>
    </div>
  </div>

  <script src="../../assets/vendor/lucide.min.js"></script>

</body>
