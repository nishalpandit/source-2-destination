<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Guardian & Authorized Numbers — School Admin — Source 2 Destination</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/icons/favicon.svg">
  <link rel="stylesheet" href="../../assets/vendor/bootstrap.min.css">
  <script src="../../assets/vendor/tailwind-config.js"></script>
  <script src="../../assets/vendor/tailwindcss-cdn.js"></script>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/tables.css">
  <link rel="stylesheet" href="../../assets/css/forms.css">
  <link rel="stylesheet" href="../../assets/css/charts.css">
  <link rel="stylesheet" href="../../assets/css/animations.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body data-role="school-admin" data-root="../../" data-route="school-admin/guardians/add.html" data-section="Parents & Guardians" data-page-title="Add Guardian">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-content">

        <div class="page-header">
          <div class="page-header-info"><div class="page-eyebrow">WHITELIST ENROLLMENT</div><h1 class="page-title">Add Authorized Parent / Guardian</h1><p class="page-description">Register verified father, mother, or legal guardian telephone numbers for a student.</p></div>
          <div class="page-actions"><a href="list.html" class="btn-s2d btn-s2d-secondary"><i data-lucide="arrow-left"></i><span>Guardian List</span></a></div>
        </div>
        <div class="s2d-card"><div class="s2d-card-body">
          <form data-s2d-form data-warn-unsaved="true" data-redirect="list.html" data-success-title="Guardian Whitelist Saved (Demo)">
            <div class="row g-3">
              <div class="col-md-6 s2d-field"><label class="s2d-label">Linked Student <span class="req-star">*</span></label><select name="student_id" class="s2d-select" required><option value="STU-4001">STU-4001 · Liam Hawthorne (Grade 10-A)</option><option value="STU-4002">STU-4002 · Clara Bennett (Grade 9-B)</option></select></div>
              <div class="col-md-6 s2d-field"><label class="s2d-label">Primary Guardian Full Name <span class="req-star">*</span></label><input type="text" name="name" class="s2d-input" placeholder="Robert Hawthorne" required></div>
              <div class="col-md-4 s2d-field"><label class="s2d-label">Relationship <span class="req-star">*</span></label><select name="relation" class="s2d-select" required><option>Father</option><option>Mother</option><option>Legal Guardian</option></select></div>
              <div class="col-md-4 s2d-field"><label class="s2d-label">Father Authorized Number <span class="req-star">*</span></label><input type="tel" name="fatherPhone" class="s2d-input" data-validate-phone="true" placeholder="+1 (555) 801-2210" required></div>
              <div class="col-md-4 s2d-field"><label class="s2d-label">Mother Authorized Number</label><input type="tel" name="motherPhone" class="s2d-input" placeholder="+1 (555) 801-2211"></div>
              <div class="col-md-6 s2d-field"><label class="s2d-label">Guardian Email <span class="req-star">*</span></label><input type="email" name="email" class="s2d-input" placeholder="guardian@example.com" required></div>
              <div class="col-md-6 s2d-field"><label class="s2d-label">Verification Document Status <span class="req-star">*</span></label><select name="verification" class="s2d-select" required><option>KYC Verified (School Admission File)</option><option>Court / Legal Guardianship Letter Verified</option></select></div>
            </div>
            <div class="form-actions-bar"><div class="ms-auto d-flex gap-2"><a href="list.html" class="btn-s2d btn-s2d-secondary">Cancel</a><button type="submit" class="btn-s2d btn-s2d-primary"><i data-lucide="shield-check"></i><span>Authorize Guardian Numbers</span></button></div></div>
          </form>
        </div></div>
    
      </main>
    </div>
  </div>

  <script src="../../assets/vendor/lucide.min.js"></script>
  <script src="../../assets/vendor/gsap.min.js"></script>
  <script src="../../assets/js/api-config.js"></script>

  <script src="../../assets/js/navigation.js"></script>
  <script src="../../assets/js/sidebar.js"></script>
  <script src="../../assets/js/tables.js"></script>
  <script src="../../assets/js/forms.js"></script>
  <script src="../../assets/js/charts.js"></script>
  <script src="../../assets/js/animations.js"></script>
  <script src="../../assets/js/app.js"></script>
</body>
</html>
