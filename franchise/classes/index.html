<body data-role="franchise" data-root="../../" data-route="franchise/classes/index.html" data-section="Academics" data-page-title="Classes & Sections">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-content">

        <div class="page-header">
          <div class="page-header-info"><div class="page-eyebrow">ACADEMIC STRUCTURE</div><h1 class="page-title">Assigned-School Classes &amp; Sections</h1><p class="page-description">Configure academic classes, sections, and default calling schedule groups for your assigned campuses.</p></div>
          <div class="page-actions"><button type="button" class="btn-s2d btn-s2d-primary" data-modal-open="fr-add-class-modal"><i data-lucide="plus"></i><span>Add Class / Section</span></button></div>
        </div>
        <div data-s2d-table="sch-classes-table"></div>
        <div class="s2d-modal-backdrop" id="fr-add-class-modal">
          <div class="s2d-modal-dialog"><div class="s2d-modal-header"><h3 class="s2d-card-title">Add School Class</h3><button type="button" class="btn-s2d btn-s2d-ghost btn-icon-s2d" data-modal-close><i data-lucide="x"></i></button></div>
            <form data-s2d-form data-success-title="Class Created (Demo)"><div class="s2d-modal-body">
              <div class="s2d-field"><label class="s2d-label">Assigned School <span class="req-star">*</span></label><select class="s2d-select" required><option>Oakridge Residential Academy</option><option>Westfield Collegiate Hostel</option></select></div>
              <div class="s2d-field"><label class="s2d-label">Class Name <span class="req-star">*</span></label><input type="text" class="s2d-input" placeholder="Grade 9" required></div>
              <div class="s2d-field"><label class="s2d-label">Sections (Comma Separated) <span class="req-star">*</span></label><input type="text" class="s2d-input" value="Section A, Section B" required></div>
            </div><div class="s2d-modal-footer"><button type="button" class="btn-s2d btn-s2d-secondary" data-modal-close>Cancel</button><button type="submit" class="btn-s2d btn-s2d-primary">Create Class</button></div></form>
          </div>
        </div>
    
      </main>
    </div>
