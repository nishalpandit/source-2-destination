    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-content">

        <div class="page-header"><div class="page-header-info"><div class="page-eyebrow">PARTNER ACCOUNT</div><h1 class="page-title">Franchise Profile &amp; Preferences</h1><p class="page-description">Manage partner contact details, notification alerts, and verified settlement display settings.</p></div></div>
        <div class="s2d-card"><div class="s2d-card-body">
          <form data-s2d-form data-success-title="Franchise Profile Updated (Demo)">

                <div class="col-md-6 s2d-field"><label class="s2d-label">Franchise Entity Name <span class="req-star">*</span></label><input type="text" class="s2d-input" value="North-East EduNet Partners" required></div>

                <div class="col-md-6 s2d-field"><label class="s2d-label">Contact Phone <span class="req-star">*</span></label><input type="tel" class="s2d-input" data-validate-phone="true" value="+1 (555) 201-4400" required></div>
              </div>
            </div>
            <div class="form-actions-bar"><div class="ms-auto"><button type="submit" class="btn-s2d btn-s2d-primary"><i data-lucide="save"></i><span>Save Partner Settings</span></button></div></div>
