{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create / Edit Recharge Plan — Super Admin — Source 2 Destination</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'icons/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
  <script src="{% static 'vendor/tailwind-config.js' %}"></script>
  <script src="{% static 'vendor/tailwindcss-cdn.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/tables.css' %}">
  <link rel="stylesheet" href="{% static 'css/forms.css' %}">
  <link rel="stylesheet" href="{% static 'css/charts.css' %}">
  <link rel="stylesheet" href="{% static 'css/animations.css' %}">
  <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
</head>
<body data-role="super-admin" data-root="../../" data-route="super-admin/recharges/create-plan.html" data-section="Recharge Management" data-page-title="Create Recharge Plan">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar">
      {% include 'includes/sidebar_super_admin.html' %}
    </aside>
    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-content">

        <!-- Sleek Action Toolbar -->
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3 pb-2 border-bottom border-s2d">
          <div class="d-flex align-items-center gap-2">
            <span class="d-inline-block" style="width:8px;height:8px;border-radius:50%;background:#4f46e5;"></span>
            <span class="fw-semibold text-heading" style="font-size:0.92rem;">Create / Edit Recharge Plan</span>
          </div>
          <div class="d-flex align-items-center gap-2"><a href="overview.html" class="btn-s2d btn-s2d-secondary"><i data-lucide="arrow-left"></i><span>Back to Plans</span></a></div>
        </div>
        <div class="s2d-card"><div class="s2d-card-body">
          <form method="POST" action="create-plan.html{% if plan %}?plan={{ plan.code }}{% endif %}" data-s2d-form data-warn-unsaved="true" data-redirect="overview.html" data-success-title="Recharge Plan Saved" data-success-desc="Recharge plan updated in database.">
            {% csrf_token %}
            <div class="s2d-form-section">
              <div class="form-section-meta"><h3>Plan Commercials</h3><p>Pricing and credit entitlement parameters.</p></div>
              <div class="row g-3">
                <div class="col-md-6 s2d-field"><label class="s2d-label">Plan Name <span class="req-star">*</span></label><input type="text" name="plan_name" class="s2d-input" value="{{ plan.name|default:'' }}" placeholder="e.g. Standard Term Calling Pack" required></div>
                <div class="col-md-3 s2d-field"><label class="s2d-label">Price (USD) <span class="req-star">*</span></label><input type="number" step="0.01" min="1" name="price" class="s2d-input" value="{{ plan.price|default:'22.00' }}" required></div>
                <div class="col-md-3 s2d-field"><label class="s2d-label">Allocated Minutes <span class="req-star">*</span></label><input type="number" min="10" max="5000" name="minutes" class="s2d-input" value="{{ plan.minutes_allocated|default:'300' }}" required></div>
                <div class="col-md-4 s2d-field"><label class="s2d-label">Validity Period (Days) <span class="req-star">*</span></label><input type="number" min="7" max="365" name="validity_days" class="s2d-input" value="{{ plan.validity_days|default:'120' }}" required></div>
                <div class="col-md-4 s2d-field">
                  <label class="s2d-label">Per-Call Limit Override</label>
                  <select name="per_call_cap" class="s2d-select">
                    <option value="15" {% if plan.per_call_cap == 15 %}selected{% endif %}>15 Minutes</option>
                    <option value="10" {% if plan.per_call_cap == 10 %}selected{% endif %}>10 Minutes</option>
                    <option value="20" {% if plan.per_call_cap == 20 %}selected{% endif %}>20 Minutes</option>
                  </select>
                </div>
                <div class="col-md-4 s2d-field">
                  <label class="s2d-label">Plan Status</label>
                  <select name="status" class="s2d-select">
                    <option value="Active" {% if plan.status == 'Active' %}selected{% endif %}>Active (Published)</option>
                    <option value="Draft" {% if plan.status == 'Draft' %}selected{% endif %}>Draft (Hidden)</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="form-actions-bar"><div class="unsaved-indicator"><i data-lucide="alert-circle" style="width:15px;height:15px;"></i><span>Unsaved changes</span></div><div class="ms-auto d-flex gap-2"><a href="overview.html" class="btn-s2d btn-s2d-secondary">Cancel</a><button type="submit" class="btn-s2d btn-s2d-primary"><i data-lucide="save"></i><span>Save Recharge Plan</span></button></div></div>
          </form>
        </div></div>
    
      </main>
    </div>
  </div>

  <script src="{% static 'vendor/lucide.min.js' %}"></script>
  <script src="{% static 'vendor/gsap.min.js' %}"></script>
  <script src="{% static 'js/api-config.js' %}"></script>
  <script src="{% static 'js/demo-data.js' %}"></script>
  <script src="{% static 'js/notifications.js' %}"></script>
  <script src="{% static 'js/modals.js' %}"></script>
  <script src="{% static 'js/navigation.js' %}"></script>
  <script src="{% static 'js/sidebar.js' %}"></script>
  <script src="{% static 'js/tables.js' %}"></script>
  <script src="{% static 'js/forms.js' %}"></script>
  <script src="{% static 'js/charts.js' %}"></script>
  <script src="{% static 'js/animations.js' %}"></script>
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
