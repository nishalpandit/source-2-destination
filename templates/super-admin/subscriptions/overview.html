{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscription Management — Super Admin — Source 2 Destination</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'icons/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
  <script src="{% static 'vendor/tailwind-config.js' %}"></script>
  <script src="{% static 'vendor/tailwindcss-cdn.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/tables.css' %}">
  <link rel="stylesheet" href="{% static 'css/forms.css' %}">
  <link rel="stylesheet" href="{% static 'css/charts.css' %}">
  <link rel="stylesheet" href="{% static 'css/animations.css' %}">
  <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
</head>
<body data-role="super-admin" data-root="../../" data-route="super-admin/subscriptions/overview.html" data-section="Subscriptions" data-page-title="Plans & School Subscriptions">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar">
      {% include 'includes/sidebar_super_admin.html' %}
    </aside>
    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-content">

        <!-- Sleek Action Toolbar -->
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3 pb-2 border-bottom border-s2d">
          <div class="d-flex align-items-center gap-2">
            <span class="d-inline-block" style="width:8px;height:8px;border-radius:50%;background:#4f46e5;"></span>
            <span class="fw-semibold text-heading" style="font-size:0.92rem;">Subscription Plans &amp; School Contracts</span>
          </div>
          <div class="d-flex align-items-center gap-2"><a href="create.html" class="btn-s2d btn-s2d-primary"><i data-lucide="plus"></i><span>Create / Assign Subscription</span></a></div>
        </div>
        <div class="row g-3 mb-4">
          <div class="col-6 col-lg-3"><div class="kpi-card"><div class="kpi-label">Annual Recurring Revenue</div><div class="kpi-value mt-2">$348,200</div></div></div>
          <div class="col-6 col-lg-3"><div class="kpi-card"><div class="kpi-label">Active Contracts</div><div class="kpi-value mt-2">48</div></div></div>
          <div class="col-6 col-lg-3"><div class="kpi-card"><div class="kpi-label">Expiring (&lt;30d)</div><div class="kpi-value mt-2">2</div></div></div>
          <div class="col-6 col-lg-3"><div class="kpi-card"><div class="kpi-label">Expired / Past Due</div><div class="kpi-value mt-2">2</div></div></div>
        </div>
        <div data-s2d-table="sa-subscriptions-table"></div>
    
      </main>
    </div>
  </div>

  <script src="{% static 'vendor/lucide.min.js' %}"></script>
  <script src="{% static 'vendor/gsap.min.js' %}"></script>
  <script src="{% static 'js/api-config.js' %}"></script>
  <script src="{% static 'js/demo-data.js' %}"></script>
  <script src="{% static 'js/notifications.js' %}"></script>
  <script src="{% static 'js/modals.js' %}"></script>
  <script src="{% static 'js/navigation.js' %}"></script>
  <script src="{% static 'js/sidebar.js' %}"></script>
  <script src="{% static 'js/tables.js' %}"></script>
  <script src="{% static 'js/forms.js' %}"></script>
  <script src="{% static 'js/charts.js' %}"></script>
  <script src="{% static 'js/animations.js' %}"></script>
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
