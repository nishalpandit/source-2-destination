{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Directory — School Admin — Source 2 Destination</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'icons/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
  <script src="{% static 'vendor/tailwind-config.js' %}"></script>
  <script src="{% static 'vendor/tailwindcss-cdn.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">

<body data-role="school-admin" data-root="../../" data-route="school-admin/students/list.html" data-section="Student Management" data-page-title="Student Directory">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-content">

        <div class="page-header">
          <div class="page-header-info"><div class="page-eyebrow">OAKRIDGE RESIDENTIAL ACADEMY</div><h1 class="page-title">Enrolled Boarding Students</h1><p class="page-description">Search, filter, enroll, and manage student calling accounts, server-assigned codes, guardian whitelists, and booth assignments.</p></div>
          <div class="page-actions"><a href="../bulk-upload/index.html" class="btn-s2d btn-s2d-secondary"><i data-lucide="file-spreadsheet"></i><span>Bulk Upload</span></a><a href="add.html" class="btn-s2d btn-s2d-primary"><i data-lucide="user-plus"></i><span>Enroll Student</span></a></div>
        </div>
        <div data-s2d-table="sch-students-table"></div>
    
      </main>
    </div>
  </div>

  <script src="{% static 'vendor/lucide.min.js' %}"></script>
  <script src="{% static 'vendor/gsap.min.js' %}"></script>
  <script src="{% static 'js/api-config.js' %}"></script>

  <script src="{% static 'js/charts.js' %}"></script>
  <script src="{% static 'js/animations.js' %}"></script>
  <script src="{% static 'js/app.js' %}"></script>
