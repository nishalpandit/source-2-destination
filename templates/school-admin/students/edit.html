{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Student — School Admin — Source 2 Destination</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'icons/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
  <script src="{% static 'vendor/tailwind-config.js' %}"></script>
  <script src="{% static 'vendor/tailwindcss-cdn.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/tables.css' %}">
  <link rel="stylesheet" href="{% static 'css/forms.css' %}">
  <link rel="stylesheet" href="{% static 'css/charts.css' %}">
  <link rel="stylesheet" href="{% static 'css/animations.css' %}">
  <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
</head>
<body data-role="school-admin" data-root="../../" data-route="school-admin/students/edit.html" data-section="Student Management" data-page-title="Edit Student">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar">
      {% include 'includes/sidebar_school_admin.html' %}
    </aside>
    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-content">

        <!-- Sleek Action Toolbar -->
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3 pb-2 border-bottom border-s2d">
          <div class="d-flex align-items-center gap-2">
            <span class="d-inline-block" style="width:8px;height:8px;border-radius:50%;background:#0284c7;"></span>
            <span class="fw-semibold text-heading" style="font-size:0.92rem;">Edit <span data-bind-field="name">{{ student.name }}</span></span>
          </div>
          <div class="d-flex align-items-center gap-2"><a href="details.html?id={{ student.code }}" class="btn-s2d btn-s2d-secondary"><i data-lucide="eye"></i><span>360° Details</span></a></div>
        </div>
        <div class="s2d-card"><div class="s2d-card-body">
          <form method="POST" action="edit.html?id={{ student.code }}" data-s2d-form data-warn-unsaved="true">
            {% csrf_token %}
            <div class="row g-3">
              <div class="col-md-5 s2d-field"><label class="s2d-label">Student Name <span class="req-star">*</span></label><input type="text" name="name" class="s2d-input" data-bind-field="name" value="{{ student.name }}" required></div>
              <div class="col-md-3 s2d-field">
                <label class="s2d-label">Gender <span class="req-star">*</span></label>
                <select name="gender" class="s2d-select" required>
                  <option value="Male" {% if student.gender == 'Male' %}selected{% endif %}>Male</option>
                  <option value="Female" {% if student.gender == 'Female' %}selected{% endif %}>Female</option>
                  <option value="Other" {% if student.gender == 'Other' %}selected{% endif %}>Other</option>
                </select>
              </div>
              <div class="col-md-4 s2d-field"><label class="s2d-label">Unique Calling Code (Server Immutable)</label><input type="text" class="s2d-input mono-code" data-bind-field="studentCode" value="{{ student.calling_code }}" readonly></div>

              <div class="col-md-4 s2d-field"><label class="s2d-label">Class <span class="req-star">*</span></label><input type="text" name="className" class="s2d-input" data-bind-field="className" value="{{ student.class_name }}" required></div>
              <div class="col-md-4 s2d-field"><label class="s2d-label">Section <span class="req-star">*</span></label><input type="text" name="section" class="s2d-input" data-bind-field="section" value="{{ student.section }}" required></div>
              <div class="col-md-4 s2d-field"><label class="s2d-label">Roll Number</label><input type="text" name="roll_number" class="s2d-input" value="{{ student.roll_number }}"></div>

              <div class="col-md-6 s2d-field"><label class="s2d-label">Hostel Wing &amp; Room <span class="req-star">*</span></label><input type="text" name="hostelWing" class="s2d-input" data-bind-field="hostelWing" value="{{ student.hostel_wing }}" required></div>
              <div class="col-md-6 s2d-field"><label class="s2d-label">Primary Guardian Name <span class="req-star">*</span></label><input type="text" name="guardianName" class="s2d-input" value="{{ student.guardian_name }}" required></div>

              <div class="col-md-6 s2d-field"><label class="s2d-label">Primary Guardian Phone <span class="req-star">*</span></label><input type="tel" name="primaryPhone" class="s2d-input" data-bind-field="primaryPhone" data-validate-phone="true" value="{{ student.primary_phone }}" required></div>
              <div class="col-md-6 s2d-field"><label class="s2d-label">Secondary Guardian Phone</label><input type="tel" name="secondaryPhone" class="s2d-input" value="{{ student.secondary_phone }}"></div>

              <div class="col-md-3 s2d-field"><label class="s2d-label">Validity Expiry <span class="req-star">*</span></label><input type="date" name="validityExpiry" class="s2d-input" data-bind-field="validityExpiry" value="{{ student.validity_expiry|date:'Y-m-d' }}" required></div>
              <div class="col-md-3 s2d-field"><label class="s2d-label">Daily Limit (Mins)</label><input type="number" name="dailyLimitMin" class="s2d-input" value="{{ student.daily_limit_min }}" min="5" max="60"></div>
              <div class="col-md-3 s2d-field"><label class="s2d-label">Available Minutes</label><input type="number" name="remainingMinutes" class="s2d-input" value="{{ student.remaining_minutes }}" min="0"></div>
              <div class="col-md-3 s2d-field"><label class="s2d-label">Account Status <span class="req-star">*</span></label>
                <select name="status" class="s2d-select" data-bind-field="status">
                  <option value="Active" {% if student.status == 'Active' %}selected{% endif %}>Active</option>
                  <option value="Inactive" {% if student.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                  <option value="Suspended" {% if student.status == 'Suspended' %}selected{% endif %}>Suspended</option>
                </select>
              </div>
            </div>
            <div class="form-actions-bar"><div class="unsaved-indicator"><i data-lucide="alert-circle" style="width:15px;height:15px;"></i><span>Unsaved changes</span></div><div class="ms-auto d-flex gap-2"><a href="list.html" class="btn-s2d btn-s2d-secondary">Cancel</a><button type="submit" class="btn-s2d btn-s2d-primary"><i data-lucide="save"></i><span>Save Student Record</span></button></div></div>
          </form>
        </div></div>
    
      </main>
    </div>
  </div>

  <script src="{% static 'vendor/lucide.min.js' %}"></script>
  <script src="{% static 'vendor/gsap.min.js' %}"></script>
  <script src="{% static 'js/api-config.js' %}"></script>
  <script src="{% static 'js/notifications.js' %}"></script>
  <script src="{% static 'js/modals.js' %}"></script>
  <script src="{% static 'js/navigation.js' %}"></script>
  <script src="{% static 'js/sidebar.js' %}"></script>
  <script src="{% static 'js/tables.js' %}"></script>
  <script src="{% static 'js/forms.js' %}"></script>
  <script src="{% static 'js/charts.js' %}"></script>
  <script src="{% static 'js/animations.js' %}"></script>
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
