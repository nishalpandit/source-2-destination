{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Guardian Numbers — School Admin — Source 2 Destination</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'icons/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
  <script src="{% static 'vendor/tailwind-config.js' %}"></script>
  <script src="{% static 'vendor/tailwindcss-cdn.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/tables.css' %}">
  <link rel="stylesheet" href="{% static 'css/forms.css' %}">
  <link rel="stylesheet" href="{% static 'css/charts.css' %}">
  <link rel="stylesheet" href="{% static 'css/animations.css' %}">
  <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
</head>
<body data-role="school-admin" data-root="../../" data-route="school-admin/guardians/edit.html" data-section="Parents & Guardians" data-page-title="Edit Guardian">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-content">

        <div class="page-header">
          <div class="page-header-info"><div class="page-eyebrow">UPDATE WHITELIST · <span data-bind-field="id">GRD-501</span></div><h1 class="page-title">Edit <span data-bind-field="name">Robert Hawthorne</span></h1><p class="page-description">Modify verified contact numbers or pause dialer authorization.</p></div>
          <div class="page-actions"><a href="list.html" class="btn-s2d btn-s2d-secondary"><i data-lucide="arrow-left"></i><span>Back</span></a></div>
        </div>
        <div class="s2d-card"><div class="s2d-card-body">
          <form data-s2d-form data-warn-unsaved="true" data-redirect="details.html?id=GRD-501" data-success-title="Guardian Record Updated (Demo)">
            <div class="row g-3">
              <div class="col-md-6 s2d-field"><label class="s2d-label">Guardian Name <span class="req-star">*</span></label><input type="text" name="name" class="s2d-input" data-bind-field="name" value="Robert Hawthorne" required></div>
              <div class="col-md-6 s2d-field"><label class="s2d-label">Email <span class="req-star">*</span></label><input type="email" name="email" class="s2d-input" data-bind-field="email" value="r.hawthorne@example.com" required></div>
              <div class="col-md-4 s2d-field"><label class="s2d-label">Father Authorized Phone <span class="req-star">*</span></label><input type="tel" name="fatherPhone" class="s2d-input" data-bind-field="fatherPhone" data-validate-phone="true" value="+1 (555) 801-2210" required></div>
              <div class="col-md-4 s2d-field"><label class="s2d-label">Mother Authorized Phone</label><input type="tel" name="motherPhone" class="s2d-input" data-bind-field="motherPhone" value="+1 (555) 801-2211"></div>
              <div class="col-md-4 s2d-field"><label class="s2d-label">Authorization Status</label><select name="status" class="s2d-select" data-bind-field="status"><option value="Active">Active (Authorized)</option><option value="Inactive">Revoked / Paused</option></select></div>
            </div>
            <div class="form-actions-bar"><div class="ms-auto d-flex gap-2"><a href="list.html" class="btn-s2d btn-s2d-secondary">Cancel</a><button type="submit" class="btn-s2d btn-s2d-primary"><i data-lucide="save"></i><span>Save Whitelist</span></button></div></div>
          </form>
        </div></div>
    
      </main>
    </div>
  </div>

  <script src="{% static 'vendor/lucide.min.js' %}"></script>
  <script src="{% static 'vendor/gsap.min.js' %}"></script>
  <script src="{% static 'js/api-config.js' %}"></script>
  <script src="{% static 'js/demo-data.js' %}"></script>
  <script src="{% static 'js/notifications.js' %}"></script>
  <script src="{% static 'js/modals.js' %}"></script>
  <script src="{% static 'js/navigation.js' %}"></script>
  <script src="{% static 'js/sidebar.js' %}"></script>
  <script src="{% static 'js/tables.js' %}"></script>
  <script src="{% static 'js/forms.js' %}"></script>
  <script src="{% static 'js/charts.js' %}"></script>
  <script src="{% static 'js/animations.js' %}"></script>
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
