{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Classes — School Admin — Source 2 Destination</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'icons/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
  <script src="{% static 'vendor/tailwind-config.js' %}"></script>
  <script src="{% static 'vendor/tailwindcss-cdn.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/tables.css' %}">
  <link rel="stylesheet" href="{% static 'css/forms.css' %}">
  <link rel="stylesheet" href="{% static 'css/charts.css' %}">
  <link rel="stylesheet" href="{% static 'css/animations.css' %}">
  <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
</head>
<body data-role="school-admin" data-root="../../" data-route="school-admin/classes/list.html" data-section="Classes & Sections" data-page-title="Classes Management">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar">
      {% include 'includes/sidebar_school_admin.html' %}
    </aside>
    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-content">

        <!-- Sleek Classes Action Toolbar -->
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3 pb-2 border-bottom border-s2d">
          <div class="d-flex align-items-center gap-2">
            <span class="d-inline-block" style="width:8px;height:8px;border-radius:50%;background:#0284c7;"></span>
            <span class="fw-semibold text-heading" style="font-size:0.92rem;">Campus Classes Directory</span>
            <span class="badge s2d-badge-subtle">{{ classes|length|default:"6" }} Classes</span>
          </div>
          <div class="d-flex align-items-center gap-2">
            <a href="sections.html" class="btn-s2d btn-s2d-secondary btn-sm-s2d"><i data-lucide="layout-list"></i><span>Manage Sections</span></a>
            <button type="button" class="btn-s2d btn-s2d-primary btn-sm-s2d" data-modal-open="add-class-modal"><i data-lucide="plus"></i><span>Add Class</span></button>
          </div>
        </div>
        <div data-s2d-table="sch-classes-table"></div>
        <div class="s2d-modal-backdrop" id="add-class-modal">
          <div class="s2d-modal-dialog">
            <div class="s2d-modal-header">
              <h3 class="s2d-card-title">Create New Academic Class</h3>
              <button type="button" class="btn-s2d btn-s2d-ghost btn-icon-s2d" data-modal-close><i data-lucide="x"></i></button>
            </div>
            <form method="POST" action="list.html" data-s2d-form data-success-title="Academic Class Created" data-success-desc="Grade added to campus academic hierarchy.">
              {% csrf_token %}
              <div class="s2d-modal-body">
                <div class="s2d-field">
                  <label class="s2d-label" for="new_class_name">Class / Grade Name <span class="req-star">*</span></label>
                  <input type="text" id="new_class_name" name="className" class="s2d-input" placeholder="e.g. Grade 6 or Class 11-Science" required>
                </div>
                <div class="s2d-field">
                  <label class="s2d-label" for="new_supervisor">Grade Coordinator / Supervisor <span class="req-star">*</span></label>
                  <input type="text" id="new_supervisor" name="supervisor" class="s2d-input" placeholder="e.g. Mrs. Eleanor Hughes" required>
                </div>
                <div class="s2d-field">
                  <label class="s2d-label" for="new_daily_cap">Default Daily Call Cap (Mins) <span class="req-star">*</span></label>
                  <input type="number" id="new_daily_cap" name="defaultDailyMinutes" min="5" max="60" class="s2d-input" value="15" required>
                </div>
                <div class="s2d-field">
                  <label class="s2d-label" for="new_sched_group">Calling Schedule Policy</label>
                  <select id="new_sched_group" name="schedule_group" class="s2d-select">
                    <option value="Standard Hostel Window">Standard Hostel Window</option>
                    <option value="Junior Evening Window">Junior Evening Window</option>
                    <option value="Senior Study-Safe Window">Senior Study-Safe Window</option>
                  </select>
                </div>
              </div>
              <div class="s2d-modal-footer">
                <button type="button" class="btn-s2d btn-s2d-secondary" data-modal-close>Cancel</button>
                <button type="submit" class="btn-s2d btn-s2d-primary"><i data-lucide="check"></i><span>Save Class</span></button>
              </div>
            </form>
          </div>
        </div>
    
      </main>
    </div>
  </div>

  <script src="{% static 'vendor/lucide.min.js' %}"></script>
  <script src="{% static 'vendor/gsap.min.js' %}"></script>
  <script src="{% static 'js/api-config.js' %}"></script>
  <script src="{% static 'js/demo-data.js' %}"></script>
  <script src="{% static 'js/notifications.js' %}"></script>
  <script src="{% static 'js/modals.js' %}"></script>
  <script src="{% static 'js/navigation.js' %}"></script>
  <script src="{% static 'js/sidebar.js' %}"></script>
  <script src="{% static 'js/tables.js' %}"></script>
  <script src="{% static 'js/forms.js' %}"></script>
  <script src="{% static 'js/charts.js' %}"></script>
  <script src="{% static 'js/animations.js' %}"></script>
  <script>
    if (window.S2D_DEMO && {{ classes_json|safe }}) {
      window.S2D_DEMO.classes = {{ classes_json|safe }};
    }
  </script>
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
