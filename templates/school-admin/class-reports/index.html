{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class-wise Reports — School Admin — Source 2 Destination</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'icons/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
  <script src="{% static 'vendor/tailwind-config.js' %}"></script>
  <script src="{% static 'vendor/tailwindcss-cdn.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/tables.css' %}">
  <link rel="stylesheet" href="{% static 'css/forms.css' %}">
  <link rel="stylesheet" href="{% static 'css/charts.css' %}">
  <link rel="stylesheet" href="{% static 'css/animations.css' %}">
  <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
</head>
<body data-role="school-admin" data-root="../../" data-route="school-admin/class-reports/index.html" data-section="Hostel & Reporting" data-page-title="Class Reports">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-content">

        <div class="page-header"><div class="page-header-info"><div class="page-eyebrow">ACADEMIC COHORT ANALYTICS</div><h1 class="page-title">Class &amp; Section Calling Activity Reports</h1><p class="page-description">Compare calling consumption and active account ratios across Grades 7–12.</p></div></div>
        <div class="row g-4 mb-4">
          <div class="col-lg-6"><div class="chart-card"><div class="chart-card-header"><h3 class="chart-card-title">Calling Minutes by Class</h3></div><div class="chart-card-body"><div class="chart-canvas" data-s2d-chart="sch-usage-by-class"></div></div></div></div>
          <div class="col-lg-6"><div class="chart-card"><div class="chart-card-header"><h3 class="chart-card-title">Active vs Inactive by Class</h3></div><div class="chart-card-body"><div class="chart-canvas" data-s2d-chart="sch-class-distribution"></div></div></div></div>
        </div>
        <div data-s2d-table="sch-classes-table"></div>
    
      </main>
    </div>
  </div>

  <script src="{% static 'vendor/lucide.min.js' %}"></script>
  <script src="{% static 'vendor/apexcharts.min.js' %}"></script>
  <script src="{% static 'vendor/gsap.min.js' %}"></script>
  <script src="{% static 'js/api-config.js' %}"></script>
  <script src="{% static 'js/demo-data.js' %}"></script>
  <script src="{% static 'js/notifications.js' %}"></script>
  <script src="{% static 'js/modals.js' %}"></script>
  <script src="{% static 'js/navigation.js' %}"></script>
  <script src="{% static 'js/sidebar.js' %}"></script>
  <script src="{% static 'js/tables.js' %}"></script>
  <script src="{% static 'js/forms.js' %}"></script>
  <script src="{% static 'js/charts.js' %}"></script>
  <script src="{% static 'js/animations.js' %}"></script>
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
