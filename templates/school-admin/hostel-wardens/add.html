{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Hostel Warden — School Admin — Source 2 Destination</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'icons/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
  <script src="{% static 'vendor/tailwind-config.js' %}"></script>
  <script src="{% static 'vendor/tailwindcss-cdn.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/tables.css' %}">
  <link rel="stylesheet" href="{% static 'css/forms.css' %}">
  <link rel="stylesheet" href="{% static 'css/charts.css' %}">
  <link rel="stylesheet" href="{% static 'css/animations.css' %}">
  <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
</head>
<body data-role="school-admin" data-root="../../" data-route="school-admin/hostel-wardens/add.html" data-section="Hostel Wardens" data-page-title="Add Warden">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-content">

        <div class="page-header">
          <div class="page-header-info"><div class="page-eyebrow">STAFF ONBOARDING</div><h1 class="page-title">Add Hostel Warden &amp; Wing Assignment</h1><p class="page-description">Register a hostel warden to supervise calling booths and authorize emergency out-of-window guardian calls.</p></div>
          <div class="page-actions"><a href="list.html" class="btn-s2d btn-s2d-secondary"><i data-lucide="arrow-left"></i><span>Warden List</span></a></div>
        </div>
        <div class="s2d-card"><div class="s2d-card-body">
          <form data-s2d-form data-warn-unsaved="true" data-redirect="list.html" data-success-title="Hostel Warden Added (Demo)">
            <div class="row g-3">
              <div class="col-md-6 s2d-field"><label class="s2d-label">Warden Full Name <span class="req-star">*</span></label><input type="text" name="name" class="s2d-input" placeholder="Mrs. Martha Jennings" required></div>
              <div class="col-md-6 s2d-field"><label class="s2d-label">Institutional Email <span class="req-star">*</span></label><input type="email" name="email" class="s2d-input" placeholder="m.jennings@oakridge-academy.edu" required></div>
              <div class="col-md-4 s2d-field"><label class="s2d-label">Mobile Number <span class="req-star">*</span></label><input type="tel" name="phone" class="s2d-input" data-validate-phone="true" placeholder="+1 (555) 210-9120" required></div>
              <div class="col-md-4 s2d-field"><label class="s2d-label">Assigned Hostel Wing <span class="req-star">*</span></label><select name="hostelWing" class="s2d-select" required><option>North Hall (Boys)</option><option>East Gables (Girls)</option><option>Junior Wing (Grades 7–8)</option></select></div>
              <div class="col-md-4 s2d-field"><label class="s2d-label">Duty Shift Hours <span class="req-star">*</span></label><input type="text" name="shiftHours" class="s2d-input mono-code" value="15:30 – 23:30" required></div>
            </div>
            <div class="form-actions-bar"><div class="ms-auto d-flex gap-2"><a href="list.html" class="btn-s2d btn-s2d-secondary">Cancel</a><button type="submit" class="btn-s2d btn-s2d-primary"><i data-lucide="check"></i><span>Create Warden Profile</span></button></div></div>
          </form>
        </div></div>
    
      </main>
    </div>
  </div>

  <script src="{% static 'vendor/lucide.min.js' %}"></script>
  <script src="{% static 'vendor/gsap.min.js' %}"></script>
  <script src="{% static 'js/api-config.js' %}"></script>
  <script src="{% static 'js/demo-data.js' %}"></script>
  <script src="{% static 'js/notifications.js' %}"></script>
  <script src="{% static 'js/modals.js' %}"></script>
  <script src="{% static 'js/navigation.js' %}"></script>
  <script src="{% static 'js/sidebar.js' %}"></script>
  <script src="{% static 'js/tables.js' %}"></script>
  <script src="{% static 'js/forms.js' %}"></script>
  <script src="{% static 'js/charts.js' %}"></script>
  <script src="{% static 'js/animations.js' %}"></script>
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
