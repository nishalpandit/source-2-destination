{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Hostel Warden — School Admin — Source 2 Destination</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'icons/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
  <script src="{% static 'vendor/tailwind-config.js' %}"></script>
  <script src="{% static 'vendor/tailwindcss-cdn.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/tables.css' %}">
  <link rel="stylesheet" href="{% static 'css/forms.css' %}">
  <link rel="stylesheet" href="{% static 'css/charts.css' %}">
  <link rel="stylesheet" href="{% static 'css/animations.css' %}">
  <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
</head>
<body data-role="school-admin" data-root="../../" data-route="school-admin/hostel-wardens/add.html" data-section="Hostel Wardens" data-page-title="Add Warden">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar">
      {% include 'includes/sidebar_school_admin.html' %}
    </aside>
    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-content">

        <!-- Sleek Action Toolbar -->
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3 pb-2 border-bottom border-s2d">
          <div class="d-flex align-items-center gap-2">
            <span class="d-inline-block" style="width:8px;height:8px;border-radius:50%;background:#0284c7;"></span>
            <span class="fw-semibold text-heading" style="font-size:0.92rem;">Add Hostel Warden &amp; Wing Assignment</span>
          </div>
          <div class="d-flex align-items-center gap-2"><a href="list.html" class="btn-s2d btn-s2d-secondary"><i data-lucide="arrow-left"></i><span>Warden List</span></a></div>
        </div>
        <div class="s2d-card"><div class="s2d-card-body">
          <form method="POST" action="add.html" data-warn-unsaved="true">
            {% csrf_token %}
            <div class="row g-3">
              <div class="col-md-6 s2d-field"><label class="s2d-label">Warden Full Name <span class="req-star">*</span></label><input type="text" name="name" class="s2d-input" placeholder="e.g. Subedar Rajeshwar Singh" required></div>
              <div class="col-md-6 s2d-field"><label class="s2d-label">Institutional Email <span class="req-star">*</span></label><input type="email" name="email" class="s2d-input" placeholder="warden@doonvalley.edu.in" required></div>
              <div class="col-md-4 s2d-field"><label class="s2d-label">Mobile Number <span class="req-star">*</span></label><input type="tel" name="phone" class="s2d-input" data-validate-phone="true" placeholder="+91 98101 23456" required></div>
              <div class="col-md-4 s2d-field"><label class="s2d-label">Assigned Hostel Block <span class="req-star">*</span></label><input type="text" name="hostel_block" class="s2d-input" placeholder="e.g. Tagore Bhavan (Boys)" required></div>
              <div class="col-md-4 s2d-field"><label class="s2d-label">Duty Shift Hours <span class="req-star">*</span></label><input type="text" name="shift_timings" class="s2d-input mono-code" value="15:30 – 23:30" required></div>
              <div class="col-md-4 s2d-field"><label class="s2d-label">Booths Monitored</label><input type="number" name="booths_monitored" class="s2d-input mono-code" value="4" min="1" max="50"></div>
              <div class="col-md-4 s2d-field">
                <label class="s2d-label">Duty Status</label>
                <select name="status" class="s2d-select">
                  <option value="On Duty" selected>On Duty</option>
                  <option value="Off Duty">Off Duty</option>
                  <option value="On Leave">On Leave</option>
                </select>
              </div>
            </div>
            <div class="form-actions-bar"><div class="ms-auto d-flex gap-2"><a href="list.html" class="btn-s2d btn-s2d-secondary">Cancel</a><button type="submit" class="btn-s2d btn-s2d-primary"><i data-lucide="check"></i><span>Create Warden Profile</span></button></div></div>
          </form>
        </div></div>
    
      </main>
    </div>
  </div>

  <script src="{% static 'vendor/lucide.min.js' %}"></script>
  <script src="{% static 'vendor/gsap.min.js' %}"></script>
  <script src="{% static 'js/api-config.js' %}"></script>
  <script src="{% static 'js/notifications.js' %}"></script>
  <script src="{% static 'js/modals.js' %}"></script>
  <script src="{% static 'js/navigation.js' %}"></script>
  <script src="{% static 'js/sidebar.js' %}"></script>
  <script src="{% static 'js/tables.js' %}"></script>
  <script src="{% static 'js/forms.js' %}"></script>
  <script src="{% static 'js/charts.js' %}"></script>
  <script src="{% static 'js/animations.js' %}"></script>
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
