{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hostel Warden Details — School Admin — Source 2 Destination</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'icons/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
  <script src="{% static 'vendor/tailwind-config.js' %}"></script>
  <script src="{% static 'vendor/tailwindcss-cdn.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/tables.css' %}">
  <link rel="stylesheet" href="{% static 'css/forms.css' %}">
  <link rel="stylesheet" href="{% static 'css/charts.css' %}">
  <link rel="stylesheet" href="{% static 'css/animations.css' %}">
  <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
</head>
<body data-role="school-admin" data-root="../../" data-route="school-admin/hostel-wardens/details.html" data-section="Hostel Wardens" data-page-title="Warden Details">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar">
      {% include 'includes/sidebar_school_admin.html' %}
    </aside>
    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-content">

        <!-- Sleek Action Toolbar -->
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3 pb-2 border-bottom border-s2d">
          <div class="d-flex align-items-center gap-2">
            <span class="d-inline-block" style="width:8px;height:8px;border-radius:50%;background:#0284c7;"></span>
            <span class="fw-semibold text-heading" style="font-size:0.92rem;">Major Kenneth Cole (Ret.)</span>
          </div>
          <div class="d-flex align-items-center gap-2"><a href="edit.html?id=WRD-601" class="btn-s2d btn-s2d-secondary"><i data-lucide="pencil"></i><span>Edit Assignment</span></a></div>
        </div>
        <div class="s2d-card mb-4"><div class="s2d-card-body"><div class="kv-grid">
          <div><div class="kv-item-label">Email</div><div class="kv-item-value" data-bind-field="email">k.cole@oakridge-academy.edu</div></div>
          <div><div class="kv-item-label">Phone</div><div class="kv-item-value mono-code" data-bind-field="phone">+1 (555) 210-9101</div></div>
          <div><div class="kv-item-label">Supervised Students</div><div class="kv-item-value" data-bind-field="supervisedStudents">185</div></div>
          <div><div class="kv-item-label">Supervised Booths</div><div class="kv-item-value" data-bind-field="supervisedDevices">8</div></div>
        </div></div></div>
        <div data-s2d-table="sch-devices-table"></div>
    
      </main>
    </div>
  </div>

  <script src="{% static 'vendor/lucide.min.js' %}"></script>
  <script src="{% static 'vendor/gsap.min.js' %}"></script>
  <script src="{% static 'js/api-config.js' %}"></script>
  <script src="{% static 'js/demo-data.js' %}"></script>
  <script src="{% static 'js/notifications.js' %}"></script>
  <script src="{% static 'js/modals.js' %}"></script>
  <script src="{% static 'js/navigation.js' %}"></script>
  <script src="{% static 'js/sidebar.js' %}"></script>
  <script src="{% static 'js/tables.js' %}"></script>
  <script src="{% static 'js/forms.js' %}"></script>
  <script src="{% static 'js/charts.js' %}"></script>
  <script src="{% static 'js/animations.js' %}"></script>
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
