{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recharge Student Account — School Admin — Source 2 Destination</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'icons/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
  <script src="{% static 'vendor/tailwind-config.js' %}"></script>
  <script src="{% static 'vendor/tailwindcss-cdn.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/tables.css' %}">
  <link rel="stylesheet" href="{% static 'css/forms.css' %}">
  <link rel="stylesheet" href="{% static 'css/charts.css' %}">
  <link rel="stylesheet" href="{% static 'css/animations.css' %}">
  <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
</head>
<body data-role="school-admin" data-root="../../" data-route="school-admin/recharges/student-recharge.html" data-section="Recharge Desk" data-page-title="Student Recharge">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar">
      {% include 'includes/sidebar_school_admin.html' %}
    </aside>
    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-content">

        <!-- Sleek Student Recharge Action Toolbar -->
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3 pb-2 border-bottom border-s2d">
          <div class="d-flex align-items-center gap-2">
            <span class="d-inline-block" style="width:8px;height:8px;border-radius:50%;background:#0284c7;"></span>
            <span class="fw-semibold text-heading" style="font-size:0.92rem;">Direct Student Account Recharge</span>
            <span class="badge s2d-badge-subtle">Credit Minutes &amp; Validity</span>
          </div>
          <div>
            <a href="overview.html" class="btn-s2d btn-s2d-secondary btn-sm-s2d"><i data-lucide="arrow-left"></i><span>Recharge History</span></a>
          </div>
        </div>
        <div class="s2d-card"><div class="s2d-card-body">
          <form method="POST" action="student-recharge.html" data-s2d-form data-redirect="overview.html" data-success-title="Student Recharge Applied" data-success-desc="Minutes and validity credited to student account.">
            {% csrf_token %}
            <div class="row g-3">
              <div class="col-md-6 s2d-field">
                <label class="s2d-label">Student Account <span class="req-star">*</span></label>
                <select name="student_id" class="s2d-select" required>
                  {% for s in students %}
                  <option value="{{ s.code }}">{{ s.name }} ({{ s.calling_code }} · {{ s.remaining_minutes }}m left · {{ s.validity_status }})</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-md-6 s2d-field">
                <label class="s2d-label">Recharge Plan <span class="req-star">*</span></label>
                <select name="plan_id" class="s2d-select" required>
                  {% for p in plans %}
                  <option value="{{ p.code }}">{{ p.name }} (${{ p.price }} · +{{ p.minutes_allocated }} mins · {{ p.validity_days }}d)</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-md-6 s2d-field">
                <label class="s2d-label">Collection / Settlement Mode <span class="req-star">*</span></label>
                <select name="payment_mode" class="s2d-select" required>
                  <option value="Campus Bursar Desk Ledger">Campus Bursar Desk Ledger</option>
                  <option value="Hostel Contingency Credit">Hostel Contingency Credit</option>
                  <option value="Direct Guardian Deposit">Direct Guardian Deposit</option>
                </select>
              </div>
              <div class="col-md-6 s2d-field"><label class="s2d-label">Receipt / Voucher Reference <span class="req-star">*</span></label><input type="text" name="voucher_ref" class="s2d-input mono-code" placeholder="e.g. OAK-DESK-2026-419" required></div>
            </div>
            <div class="form-actions-bar"><div class="ms-auto d-flex gap-2"><a href="overview.html" class="btn-s2d btn-s2d-secondary">Cancel</a><button type="submit" class="btn-s2d btn-s2d-primary"><i data-lucide="zap"></i><span>Apply Recharge Credits</span></button></div></div>
          </form>
        </div></div>
    
      </main>
    </div>
  </div>

  <script src="{% static 'vendor/lucide.min.js' %}"></script>
  <script src="{% static 'vendor/gsap.min.js' %}"></script>
  <script src="{% static 'js/api-config.js' %}"></script>
  <script src="{% static 'js/demo-data.js' %}"></script>
  <script src="{% static 'js/notifications.js' %}"></script>
  <script src="{% static 'js/modals.js' %}"></script>
  <script src="{% static 'js/navigation.js' %}"></script>
  <script src="{% static 'js/sidebar.js' %}"></script>
  <script src="{% static 'js/tables.js' %}"></script>
  <script src="{% static 'js/forms.js' %}"></script>
  <script src="{% static 'js/charts.js' %}"></script>
  <script src="{% static 'js/animations.js' %}"></script>
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
