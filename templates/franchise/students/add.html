{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Student — Franchise — Franchise Portal — Source 2 Destination</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'icons/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
  <script src="{% static 'vendor/tailwind-config.js' %}"></script>
  <script src="{% static 'vendor/tailwindcss-cdn.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/tables.css' %}">
  <link rel="stylesheet" href="{% static 'css/forms.css' %}">
  <link rel="stylesheet" href="{% static 'css/charts.css' %}">
  <link rel="stylesheet" href="{% static 'css/animations.css' %}">
  <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
</head>
<body data-role="franchise" data-root="../../" data-route="franchise/students/add.html" data-section="Student Directory" data-page-title="Add Student">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar">
      {% include 'includes/sidebar_franchise.html' %}
    </aside>
    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-content">

        <!-- Sleek Action Toolbar -->
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3 pb-2 border-bottom border-s2d">
          <div class="d-flex align-items-center gap-2">
            <span class="d-inline-block" style="width:8px;height:8px;border-radius:50%;background:#0d9488;"></span>
            <span class="fw-semibold text-heading" style="font-size:0.92rem;">Add Student to Assigned School</span>
          </div>
          <div class="d-flex align-items-center gap-2"><a href="list.html" class="btn-s2d btn-s2d-secondary"><i data-lucide="arrow-left"></i><span>Student List</span></a></div>
        </div>
        <div class="s2d-card"><div class="s2d-card-body">
          <form method="POST" action="add.html" data-s2d-form data-warn-unsaved="true" data-redirect="list.html" data-success-title="Student Enrolled" data-success-desc="Student enrolled into territory campus.">
            {% csrf_token %}
            <div class="row g-3">
              <div class="col-md-6 s2d-field">
                <label class="s2d-label">Assigned School <span class="req-star">*</span></label>
                <select name="school" class="s2d-select" required>
                  {% for sch in schools %}
                  <option value="{{ sch.code }}">{{ sch.code }} · {{ sch.name }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-md-6 s2d-field"><label class="s2d-label">Student Full Name <span class="req-star">*</span></label><input type="text" name="name" class="s2d-input" placeholder="Legal full name" required></div>
              <div class="col-md-4 s2d-field">
                <label class="s2d-label">Class <span class="req-star">*</span></label>
                <select name="className" class="s2d-select" required>
                  <option value="Grade 9">Grade 9</option>
                  <option value="Grade 10">Grade 10</option>
                  <option value="Grade 11">Grade 11</option>
                  <option value="Grade 12">Grade 12</option>
                </select>
              </div>
              <div class="col-md-4 s2d-field">
                <label class="s2d-label">Section <span class="req-star">*</span></label>
                <select name="section" class="s2d-select" required>
                  <option value="Section A">Section A</option>
                  <option value="Section B">Section B</option>
                  <option value="Section C">Section C</option>
                </select>
              </div>
              <div class="col-md-4 s2d-field"><label class="s2d-label">Unique Calling Code</label><input type="text" class="s2d-input mono-code" value="Auto-generated on save" readonly></div>
              <div class="col-md-6 s2d-field"><label class="s2d-label">Primary Guardian Name <span class="req-star">*</span></label><input type="text" name="guardianName" class="s2d-input" placeholder="e.g. Thomas Vance (Father)" required></div>
              <div class="col-md-6 s2d-field"><label class="s2d-label">Authorized Primary Phone <span class="req-star">*</span></label><input type="tel" name="primaryPhone" class="s2d-input" data-validate-phone="true" placeholder="+1 (555) 000-0000" required></div>
            </div>
            <div class="form-actions-bar"><div class="ms-auto d-flex gap-2"><a href="list.html" class="btn-s2d btn-s2d-secondary">Cancel</a><button type="submit" class="btn-s2d btn-s2d-primary"><i data-lucide="check"></i><span>Save Student</span></button></div></div>
          </form>
        </div></div>
    
      </main>
    </div>
  </div>

  <script src="{% static 'vendor/lucide.min.js' %}"></script>
  <script src="{% static 'vendor/gsap.min.js' %}"></script>
  <script src="{% static 'js/api-config.js' %}"></script>
  <script src="{% static 'js/demo-data.js' %}"></script>
  <script src="{% static 'js/notifications.js' %}"></script>
  <script src="{% static 'js/modals.js' %}"></script>
  <script src="{% static 'js/navigation.js' %}"></script>
  <script src="{% static 'js/sidebar.js' %}"></script>
  <script src="{% static 'js/tables.js' %}"></script>
  <script src="{% static 'js/forms.js' %}"></script>
  <script src="{% static 'js/charts.js' %}"></script>
  <script src="{% static 'js/animations.js' %}"></script>
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
