{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recharge Management — Franchise — Franchise Portal — Source 2 Destination</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'icons/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
  <script src="{% static 'vendor/tailwind-config.js' %}"></script>
  <script src="{% static 'vendor/tailwindcss-cdn.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/tables.css' %}">
  <link rel="stylesheet" href="{% static 'css/forms.css' %}">
  <link rel="stylesheet" href="{% static 'css/charts.css' %}">
  <link rel="stylesheet" href="{% static 'css/animations.css' %}">
  <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
</head>
<body data-role="franchise" data-root="../../" data-route="franchise/recharges/index.html" data-section="Calling & Validity" data-page-title="Recharge Management">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-content">

        <div class="page-header">
          <div class="page-header-info"><div class="page-eyebrow">TERRITORY CREDITS</div><h1 class="page-title">Recharge Requests &amp; Credit Allocations</h1><p class="page-description">Track school desk recharge requests, bulk credit allocations, and settlement status across assigned schools.</p></div>
          <div class="page-actions"><button type="button" class="btn-s2d btn-s2d-primary" data-demo-action="Recharge Allocation Submitted"><i data-lucide="zap"></i><span>New Credit Allocation</span></button></div>
        </div>
        <div data-s2d-table="sa-recharge-history-table"></div>
    
      </main>
    </div>
  </div>

  <script src="{% static 'vendor/lucide.min.js' %}"></script>
  <script src="{% static 'vendor/gsap.min.js' %}"></script>
  <script src="{% static 'js/api-config.js' %}"></script>
  <script src="{% static 'js/demo-data.js' %}"></script>
  <script src="{% static 'js/notifications.js' %}"></script>
  <script src="{% static 'js/modals.js' %}"></script>
  <script src="{% static 'js/navigation.js' %}"></script>
  <script src="{% static 'js/sidebar.js' %}"></script>
  <script src="{% static 'js/tables.js' %}"></script>
  <script src="{% static 'js/forms.js' %}"></script>
  <script src="{% static 'js/charts.js' %}"></script>
  <script src="{% static 'js/animations.js' %}"></script>
  <script>
    if (window.S2D_DEMO && {{ recharges_json|safe }}) {
      window.S2D_DEMO.recharges = {{ recharges_json|safe }};
    }
  </script>
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
