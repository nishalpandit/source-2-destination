<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../../assets/vendor/bootstrap.min.css">
  <script src="../../assets/vendor/tailwind-config.js"></script>
  <script src="../../assets/vendor/tailwindcss-cdn.js"></script>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/tables.css">
  <link rel="stylesheet" href="../../assets/css/forms.css">
  <link rel="stylesheet" href="../../assets/css/charts.css">

<body data-role="super-admin" data-root="../../" data-route="super-admin/subscriptions/create.html" data-section="Subscriptions" data-page-title="Create / Assign Plan">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-content">

        <div class="page-header">
          <div class="page-header-info"><div class="page-eyebrow">CONTRACT PROVISIONING</div><h1 class="page-title">Create / Assign School Subscription</h1><p class="page-description">Configure institutional subscription tier, licensed student &amp; kiosk seats, billing cycle, and renewal terms.</p></div>
          <div class="page-actions"><a href="overview.html" class="btn-s2d btn-s2d-secondary"><i data-lucide="arrow-left"></i><span>Subscriptions</span></a></div>
        </div>
        <div class="s2d-card"><div class="s2d-card-body">
          <form data-s2d-form data-warn-unsaved="true" data-redirect="overview.html" data-success-title="Subscription Contract Saved (Demo)">
            <div class="s2d-form-section">
              <div class="form-section-meta"><h3>Contract Assignment</h3><p>Bind a campus tenant to a commercial licensing tier.</p></div>
              <div class="row g-3">
                <div class="col-md-6 s2d-field"><label class="s2d-label">School Tenant <span class="req-star">*</span></label><select name="school" class="s2d-select" required><option value="SCH-1001">Oakridge Residential Academy</option><option value="SCH-1003">St. Jude Boarding Institute</option><option value="SCH-1006">Maplewood Residential High</option></select></div>
                <div class="col-md-6 s2d-field"><label class="s2d-label">Subscription Plan Tier <span class="req-star">*</span></label><select name="planName" class="s2d-select" required><option value="Enterprise Boarding Annual">Enterprise Boarding Annual ($8,400)</option><option value="Campus Growth Annual">Campus Growth Annual ($5,900)</option><option value="Standard Hostel Quarterly">Standard Hostel Quarterly ($1,850)</option></select></div>
                <div class="col-md-4 s2d-field"><label class="s2d-label">Student Seat Limit <span class="req-star">*</span></label><input type="number" name="studentSeats" class="s2d-input" value="750" min="50" required></div>
                <div class="col-md-4 s2d-field"><label class="s2d-label">Enrolled Kiosk Limit <span class="req-star">*</span></label><input type="number" name="deviceSeats" class="s2d-input" value="35" min="1" required></div>
                <div class="col-md-4 s2d-field"><label class="s2d-label">Contract End Date <span class="req-star">*</span></label><input type="date" name="expiryDate" class="s2d-input" value="2027-08-15" required></div>
              </div>
            </div>
            <div class="form-actions-bar"><div class="ms-auto d-flex gap-2"><a href="overview.html" class="btn-s2d btn-s2d-secondary">Cancel</a><button type="submit" class="btn-s2d btn-s2d-primary"><i data-lucide="check"></i><span>Save Subscription</span></button></div></div>
          </form>
        </div></div>
    
      </main>
    </div>
  </div>

  <script src="../../assets/vendor/lucide.min.js"></script>
  <script src="../../assets/vendor/gsap.min.js"></script>
  <script src="../../assets/js/api-config.js"></script>

  <script src="../../assets/js/forms.js"></script>
  <script src="../../assets/js/charts.js"></script>
  <script src="../../assets/js/animations.js"></script>
  <script src="../../assets/js/app.js"></script>
</body>
</html>
