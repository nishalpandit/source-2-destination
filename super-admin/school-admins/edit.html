<head>

<body data-role="super-admin" data-root="../../" data-route="super-admin/school-admins/edit.html" data-section="School Administrators" data-page-title="Edit School Admin">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-content">

        <div class="page-header">
          <div class="page-header-info">
            <div class="page-eyebrow">UPDATE ADMINISTRATOR · <span data-bind-field="id">ADM-201</span></div>
            <h1 class="page-title">Edit <span data-bind-field="name">Dr. Arthur Pendelton</span></h1>
            <p class="page-description">Update campus assignment, contact information, MFA requirement, or administrative status.</p>
          </div>
          <div class="page-actions"><a href="details.html?id=ADM-201" class="btn-s2d btn-s2d-secondary"><i data-lucide="eye"></i><span>View Details</span></a></div>
        </div>
        <div class="s2d-card"><div class="s2d-card-body">
          <form data-s2d-form data-warn-unsaved="true" data-redirect="list.html" data-success-title="Administrator Updated (Demo)">
            <div class="s2d-form-section">
              <div class="form-section-meta"><h3>Profile &amp; Contact</h3><p>Verified identity details.</p></div>
              <div class="row g-3">
                <div class="col-md-6 s2d-field"><label class="s2d-label">Full Name <span class="req-star">*</span></label><input type="text" name="name" class="s2d-input" data-bind-field="name" value="Dr. Arthur Pendelton" required></div>
                <div class="col-md-6 s2d-field"><label class="s2d-label">Designation <span class="req-star">*</span></label><input type="text" name="designation" class="s2d-input" data-bind-field="designation" value="Principal & Primary Admin" required></div>
                <div class="col-md-6 s2d-field"><label class="s2d-label">Email <span class="req-star">*</span></label><input type="email" name="email" class="s2d-input" data-bind-field="email" value="admin@oakridge-academy.edu" required></div>
                <div class="col-md-6 s2d-field"><label class="s2d-label">Phone <span class="req-star">*</span></label><input type="tel" name="phone" class="s2d-input" data-bind-field="phone" data-validate-phone="true" value="+1 (555) 210-9001" required></div>
              </div>
            </div>
            <div class="s2d-form-section">
              <div class="form-section-meta"><h3>Campus &amp; Status</h3><p>Control active workspace access.</p></div>
              <div class="row g-3">
                <div class="col-md-6 s2d-field"><label class="s2d-label">Assigned School <span class="req-star">*</span></label><select name="school" class="s2d-select" data-bind-field="school"><option value="Oakridge Residential Academy">Oakridge Residential Academy</option><option value="Westfield Collegiate Hostel">Westfield Collegiate Hostel</option><option value="St. Jude Boarding Institute">St. Jude Boarding Institute</option></select></div>
                <div class="col-md-6 s2d-field"><label class="s2d-label">Administrative Status <span class="req-star">*</span></label><select name="status" class="s2d-select" data-bind-field="status"><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div>
              </div>
            </div>
            <div class="form-actions-bar">
              <div class="unsaved-indicator"><i data-lucide="alert-circle" style="width:15px;height:15px;"></i><span>Unsaved edits</span></div>
              <div class="d-flex gap-2 ms-auto"><a href="list.html" class="btn-s2d btn-s2d-secondary">Cancel</a><button type="submit" class="btn-s2d btn-s2d-primary"><i data-lucide="save"></i><span>Save Changes</span></button></div>
            </div>
          </form>
        </div></div>
    
      </main>
    </div>
  </div>

  <script src="../../assets/vendor/lucide.min.js"></script>

  <script src="../../assets/js/forms.js"></script>
  <script src="../../assets/js/charts.js"></script>
  <script src="../../assets/js/animations.js"></script>
  <script src="../../assets/js/app.js"></script>
</body>
</html>
